<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Offline · Budgeteer</title>
    <!-- Served by the service worker (sw.js) when a page can't be loaded; keep it self-contained -->
    <style>
      :root { --bg: #0A1319; --text: #DCE3E6; --muted: #8A9AA3; --brass: #DDAA4E; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #E8EDEF; --text: #0A1319; --muted: #4A5A63; --brass: #8A5E07; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 16px; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 26rem; }
      svg { width: 64px; height: 64px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.75rem; margin: 1rem 0 0.5rem; }
      p { margin: 0 0 0.5rem; line-height: 1.5; }
      .muted { color: var(--muted); font-style: italic; }
      button {
        margin-top: 1.25rem; padding: 0.625rem 1.25rem; border: 0; border-radius: 0.5rem;
        background: var(--brass); color: #0A1319; font: inherit; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#0A1319"/>
        <g transform="translate(2 2) scale(0.875)">
          <circle cx="16" cy="16" r="14.6" fill="none" stroke="#DDAA4E" stroke-width="1.8"/>
          <path d="M16 4.6 L17.5 14.5 L27.4 16 L17.5 17.5 L16 27.4 L14.5 17.5 L4.6 16 L14.5 14.5 Z" fill="#DDAA4E"/>
          <path d="M16 4.6 L17.5 14.5 L16 16 Z M27.4 16 L17.5 17.5 L16 16 Z M16 27.4 L14.5 17.5 L16 16 Z M4.6 16 L14.5 14.5 L16 16 Z" fill="#0A1319" opacity=".5"/>
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>Budgeteer can't reach the server. Check your connection and try again.</p>
      <p class="muted">No wind in the sails.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
