version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # prisma, @prisma/client and @prisma/adapter-pg must stay on the same
      # version. Listed first because a dependency joins the first group it matches.
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
      # react, react-dom, react-is (a recharts peer) and their types must share a
      # major, so a React major arrives as one PR instead of four mismatched ones
      react:
        patterns:
          - react
          - react-dom
          - react-is
          - '@types/react'
          - '@types/react-dom'
      # One weekly PR for all non-breaking updates. Majors of other packages
      # still arrive as their own PRs.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # These majors need migration work and are upgraded deliberately, not by
    # Dependabot. Remove an entry when starting that upgrade.
    ignore:
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      # Node's type definitions follow the Node version the app runs on (22, see
      # docker/ and CI); bump this major together with the runtime
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Workflow actions (e.g. the pinned Trivy action), in one weekly PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  # Base images, in one weekly PR
  - package-ecosystem: docker
    directories:
      - /docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - '*'
    ignore:
      # Node majors move together with CI (setup-node) once the new line is LTS
      - dependency-name: node
        update-types: ['version-update:semver-major']
