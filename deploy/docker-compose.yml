services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budgeteer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: budgeteer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgeteer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/psymondk/budgeteer-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ── Required ──────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://budgeteer:${POSTGRES_PASSWORD}@postgres:5432/budgeteer
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # ── Optional ──────────────────────────────────────────────────────────
      API_PORT: 3001
      # PUBLIC_URL: the URL your browser uses to reach the app.
      # Must match the address you type into your browser (including port if non-standard).
      # Used to allow cross-origin requests from the web UI to the API.
      # Example: http://192.168.1.10:7272  or  https://budget.yourdomain.com
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:7272}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@budgeteer.local}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Set to true to populate demo households on first boot
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Base currency for all calculations — must be a currency Danmarks Nationalbank publishes rates for
      BASE_CURRENCY: ${BASE_CURRENCY:-DKK}
      # ── Optional features (leave unset for defaults; see README) ─────────
      # Key that encrypts stored secrets such as the SMTP password (default: derived from JWT_SECRET)
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # AI-assisted payslip import (Anthropic)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Startup schema sync: push (default), migrate, skip, force-push
      SCHEMA_SYNC_MODE: ${SCHEMA_SYNC_MODE:-}
      # Proxies trusted for the client IP (default: loopback + private networks)
      TRUST_PROXY: ${TRUST_PROXY:-}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-}
      API_RATE_LIMIT_WINDOW: ${API_RATE_LIMIT_WINDOW:-}
      # Receipt OCR tuning
      RECEIPT_OCR_LANG: ${RECEIPT_OCR_LANG:-}
      RECEIPT_OCR_MAX_PDF_PAGES: ${RECEIPT_OCR_MAX_PDF_PAGES:-}
      RECEIPT_OCR_PDF_DPI: ${RECEIPT_OCR_PDF_DPI:-}
      RECEIPT_OCR_PSM: ${RECEIPT_OCR_PSM:-}
      RECEIPT_OCR_TIMEOUT_MS: ${RECEIPT_OCR_TIMEOUT_MS:-}
      RECEIPT_OCR_TOTAL_TIMEOUT_MS: ${RECEIPT_OCR_TOTAL_TIMEOUT_MS:-}
      RECEIPT_OCR_MAX_PIXELS: ${RECEIPT_OCR_MAX_PIXELS:-}
      RECEIPT_OCR_PREPROCESS: ${RECEIPT_OCR_PREPROCESS:-}
      # Local/self-hosted AI for receipt cleanup and categorisation
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-}
      RECEIPT_AI_CATEGORIZE: ${RECEIPT_AI_CATEGORIZE:-}
    volumes:
      - uploads_data:/app/uploads

  web:
    image: ghcr.io/psymondk/budgeteer-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # APP_PORT: the host port the web UI is served on (default 7272)
      - "${APP_PORT:-7272}:80"

volumes:
  postgres_data:
  uploads_data:
